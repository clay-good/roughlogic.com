<!-- Pre-paint theme setter. Inlined (no network round-trip) so it does not
     render-block the home view the way an external head script does; theme.js
     itself loads `defer` below for toggle wiring and meta sync. This snippet
     only sets data-theme so the saved/system theme paints with no flash (CSS
     defaults to dark; only [data-theme="light"] differs). If you edit the body
     of this <script>, recompute its sha256 and update BOTH the script-src in
     the CSP <meta> above and the Content-Security-Policy line in _headers. -->
<script>!function(){try{var t=localStorage.getItem("rl-theme");if("high-contrast"===t)t="dark";if("dark"!==t&&"light"!==t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}}()</script>

<main id="main" tabindex="-1">

  <section id="tools" class="home" aria-labelledby="intro-heading">
    <h1 id="intro-heading" class="home-h1">Field math, answered.</h1>
    <!-- spec-v1337: one sentence, and it KEEPS THE COUNT. check-readme-counts
         requires at least two "<N> free calculators for" strings in this file,
         and as of 2026-09-01 there are three: this one, the JSON-LD
         description, and the meta description in the head, which is this same
         sentence. A visible count that no gate watches is exactly how a README
         once reached 1145 against a catalog of 1564. Four words is a cheap
         price for a drift check. -->
    <p class="home-lede">
      1,843 free calculators for the trades. Type the job the way you'd
      say it, and you get the number, the inputs, and the source.
    </p>

    <!-- One search bar. Type free text to filter, or focus it to browse the
         whole catalog; the results dropdown below routes to the tile on
         click / Enter (app.js bindSearch). -->
    <div class="hero-search" role="search">
      <label class="hero-label" for="search-input">What do you need to figure out?</label>
      <input
        id="search-input"
        type="search"
        role="combobox"
        aria-expanded="false"
        aria-controls="search-results"
        aria-autocomplete="list"
        inputmode="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="ohms law 120v 10a"
        class="search-input"
      >
      <ul id="search-results" class="search-results" role="listbox" aria-label="Tools" hidden></ul>
    </div>

    <!-- spec-v1337: the examples ARE the instructions; there is no other
         instruction text. Buttons, not links: clicking one fills the box and
         runs the same code path as typing, so what a reader sees demonstrated
         is exactly what their own typing will do. Every one of these routes to
         a real tile today -- a chip that teaches a query the site cannot
         answer is worse than no chip. Commas and spaces, never slash-joined:
         a token over 30 characters fails the 320px sweep. -->
    <div class="hero-examples">
      <span class="hero-examples-label">Try:</span>
      <!-- A chip shows the query it runs. Each carried a `data-q` with a
           longer, more explicit phrasing until 2026-09-02 -- "ohms law 120 v,
           10 a" ran "ohms law 120 volts 10 amps" -- so the four examples
           teaching "type the job the way you'd say it" were the one place on
           the site where typing what is shown does not do what is shown.

           All four are back to the short phrasing a tradesperson actually
           types, because it now works. Phase B2 in query-fill.js recovers a
           single-letter unit typed with a space, so "ohms law 120 v, 10 a"
           fills both fields where it used to fill nothing; and dropping
           pure-number tokens from a tile's NAME in the search corpus stopped
           "asphalt 2400 sq ft, 3 in deep" ranking Egress Window Well, whose
           name carries an IRC section number ending in 3.

           search-prefill asserts a chip and its own visible text reach the
           same tile, per chip. -->
      <button type="button" class="hero-chip">voltage drop 120v 150 ft 12awg 20a</button>
      <button type="button" class="hero-chip">asphalt 2400 sq ft, 3 in deep</button>
      <button type="button" class="hero-chip">ohms law 120 v, 10 a</button>
      <button type="button" class="hero-chip">friction loss 200 ft, 150 gpm</button>
    </div>

    <!-- What a reader without JavaScript is told. This said only that the site
         requires JavaScript, which stopped being the whole truth when the
         prerendered pages landed: every calculator has a static page at
         /tools/<id>/ carrying its worked example, its formula and its source,
         and none of those pages loads a line of script. Telling a no-JS reader
         the site needs JS, on a site with 1,843 pages that do not, sent them
         away from something that would have worked. The link is the point of
         the notice now; check-shells fails a <noscript> that does not carry
         it. -->
    <noscript>
      <p class="noscript-notice">Running the calculators needs JavaScript, and every calculation runs locally in your browser -- no data leaves your device. Without it, <a href="/tools/">every calculator still has a page</a> with its worked example, its formula and its source.</p>
    </noscript>

  </section>

  <section id="view-region" class="view-region" aria-live="polite" hidden>
  </section>

</main>

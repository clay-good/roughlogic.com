<!-- Pre-paint theme setter. Inlined (no network round-trip) so it does not
     render-block the home view the way an external head script does; theme.js
     itself loads `defer` below for toggle wiring and meta sync. This snippet
     only sets data-theme so the saved/system theme paints with no flash (CSS
     defaults to dark; only [data-theme="light"] differs). If you edit the body
     of this <script>, recompute its sha256 and update BOTH the script-src in
     the CSP <meta> above and the Content-Security-Policy line in _headers. -->
<script>!function(){try{var t=localStorage.getItem("rl-theme");if("high-contrast"===t)t="dark";if("dark"!==t&&"light"!==t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}}()</script>
<script src="theme.js" defer></script>

    </button>
  </div>
</header>

<main id="main" tabindex="-1">

  <section id="tools" class="home" aria-labelledby="intro-heading">
    <h1 id="intro-heading" class="home-h1">Field math, answered.</h1>
    <!-- spec-v1337: one sentence, and it KEEPS THE COUNT. check-readme-counts
         requires exactly two "<N> free calculators for" strings in this file
         (this one and the JSON-LD description above), and a visible count that
         no gate watches is exactly how a README once reached 1145 against a
         catalog of 1564. Four words is a cheap price for a drift check. -->
    <p class="home-lede">
      1,723 free calculators for the trades. Type the job the way you'd
      say it, and you get the number, the inputs, and the source.
    </p>

    <!-- One search bar. Type free text to filter, or focus it to browse the
         whole catalog; the results dropdown below routes to the tile on
         click / Enter (app.js bindSearch). -->
    <div class="hero-search" role="search">
      <label class="hero-label" for="search-input">What do you need to figure out?</label>
      <input
        id="search-input"
        type="search"
        role="combobox"
        aria-expanded="false"
        aria-controls="search-results"
        aria-autocomplete="list"
        inputmode="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="ohms law 120v 10a"
        class="search-input"
      >
      <ul id="search-results" class="search-results" role="listbox" aria-label="Tools" hidden></ul>
    </div>

    <!-- spec-v1337: the examples ARE the instructions; there is no other
         instruction text. Buttons, not links: clicking one fills the box and
         runs the same code path as typing, so what a reader sees demonstrated
         is exactly what their own typing will do. Every one of these routes to
         a real tile today -- a chip that teaches a query the site cannot
         answer is worse than no chip. Commas and spaces, never slash-joined:
         a token over 30 characters fails the 320px sweep. -->
    <div class="hero-examples">
      <span class="hero-examples-label">Try:</span>
      <button type="button" class="hero-chip" data-q="voltage drop 120v 150 ft 12 awg copper 20a single phase">voltage drop 120v 150 ft 12awg 20a</button>
      <button type="button" class="hero-chip" data-q="asphalt tonnage 2400 sq ft 3 in deep 12 ft wide">asphalt 2400 sq ft, 3 in deep</button>
      <button type="button" class="hero-chip" data-q="ohms law 120 volts 10 amps">ohms law 120 v, 10 a</button>
      <button type="button" class="hero-chip" data-q="friction loss 200 ft of hose at 150 gpm">friction loss 200 ft, 150 gpm</button>
    </div>

    <noscript>
      <p class="noscript-notice">roughlogic requires JavaScript to render the calculators. Every calculation runs locally in your browser. No data leaves your device.</p>
    </noscript>

  </section>

  <section id="view-region" class="view-region" aria-live="polite" hidden>
  </section>

</main>

    <a class="footer-badge" href="tools/" aria-label="Browse all calculators">
      <span>All calculators</span>

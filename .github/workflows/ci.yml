name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and grep checks
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Verify data integrity
        run: npm run data:verify

  # Fast a11y-only signal: axe-core scan over every tile_id in TOOLS plus
  # the home view (spec-v10 §E.3, parameterized at test-import time from
  # app.js so a new tile is automatically covered). Surfaces WCAG
  # violations early in the PR cycle before the longer integration job.
  accessibility:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install Playwright and axe-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run accessibility tests (axe-core only)
        run: npm run test:a11y

  # Full integration suite: per-tile axe-core loop + smoke + layout +
  # theme + viewer + print + CSV + perf (spec-v10 §E.1 / §E.2 / §E.3 /
  # §H.3). Catches regressions in the search auto-route, theme persistence,
  # mobile header layout, Group H reference views, and the bundle
  # round-trip. Runs in parallel with `accessibility`.
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install Playwright and axe-core
        # Chromium runs the whole suite; WebKit (the iOS Safari engine) re-runs
        # only the responsive-stress sweep via the `webkit-responsive` project
        # in playwright.config.js, so the no-horizontal-scroll guarantee is
        # verified on both engines.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Run integration tests (full suite)
        run: npm run test:e2e
      # spec-v18 §6: prerendered-shell 320px horizontal-scroll gate. Needs a
      # built dist/ and a headless browser; the integration job already has
      # Playwright + chromium, so build dist/ and run the audit here. Fails
      # if any /tools/, /groups/, or home shell scrolls sideways
      # on a 320px phone viewport.
      - name: Build site
        run: npm run build
      - name: dist/ integrity gate (no dangling same-origin references)
        run: npm run check:dist
      - name: Prerendered shell content gate (titles, JSON-LD, citation, gzip)
        run: npm run check:shells
      - name: Prerendered shell mobile audit (320px)
        run: npm run check:shell-mobile

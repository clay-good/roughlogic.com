name: CI

# Every push runs `test` only (~8 min): lint, unit tests, data integrity, the
# provenance-stamp check, and the built-copy gates that need Node but no
# browser. The two Playwright jobs (~30 min together) run nightly, on pull
# requests, and on demand (Actions -> CI -> Run workflow); as of 2026-11-14
# they no longer hold up each push to main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and grep checks
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Verify data integrity
        run: npm run data:verify
      # Needs history the depth-1 checkout above does not have, so it fetches
      # its own base rather than living in `npm run lint`. A stale data-refresh
      # branch -- one cut before a hand-correction landed on main -- passes
      # every other gate, because the snapshot it restores is internally
      # consistent. The stamps are the only tell.
      #
      # The base differs by event, and getting this wrong makes the gate blind:
      # its first wiring fetched `github.ref_name` on a push, which after the
      # push is this very commit, so it reported "OK: 0 stamps across 0 files"
      # on every run and its real path never executed. On a pull request the
      # base is the target branch; on a push it is the commit the push moved
      # FROM. The script now refuses a base equal to HEAD rather than
      # reporting OK on an empty comparison.
      # Only on a push or a pull request: a scheduled or dispatched run has no
      # "commit it moved from", and on the depth-1 checkout HEAD^ does not
      # exist, so the script (rightly) refuses to pass. Every commit on main
      # already ran this on its own push. (The first dispatched run, 2026-11-14,
      # failed exactly that way.)
      - name: Provenance stamps only move forward
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            BASE=FETCH_HEAD
          else
            BEFORE="${{ github.event.before }}"
            # All-zeros means a branch's first push: there is no prior state,
            # so the parent commit is the only honest comparison.
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) BASE="HEAD^" ;;
              *) git fetch --no-tags --depth=200 origin "$BEFORE" && BASE="$BEFORE" ;;
            esac
          fi
          echo "Comparing provenance stamps against $BASE"
          DATA_STAMP_BASE="$BASE" npm run check:data-stamps
      # The built-copy gates. They read dist/, which `npm run lint` above runs
      # before; they need Node and no browser, so they run here on every push
      # rather than waiting for the nightly Playwright jobs. The 320px shell
      # audit needs a browser and stays in `integration`.
      - name: Build site
        run: npm run build
      # The per-module gzip budget reads dist/, and `npm run lint` runs BEFORE
      # any build, so there it skips with a WARN and exit 0. It skipped in CI
      # that way until 2026-08-30, when an over-cap module went green through it.
      - name: Per-module gzip budget (needs dist/)
        run: npm run check:module-sizes
      - name: dist/ integrity gate (no dangling same-origin references)
        run: npm run check:dist
      - name: Prerendered shell content gate (titles, JSON-LD, citation, gzip)
        run: npm run check:shells
      # Per-URL <lastmod>. Fails if a page's bytes have moved since
      # scripts/page-lastmod.json was last stamped -- otherwise a changed page
      # ships with a stale date and an unchanged one is never noticed.
      - name: Sitemap lastmod ledger matches dist/
        run: npm run check:lastmod
      - name: Prerendered shell value gate (no NaN / undefined / empty answers)
        run: npm run check:shell-values

  # Fast a11y-only signal: axe-core scan over every tile_id in TOOLS plus
  # the home view (spec-v10 §E.3, parameterized at test-import time from
  # app.js so a new tile is automatically covered). Surfaces WCAG
  # violations early in the PR cycle before the longer integration job.
  accessibility:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright and axe-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run accessibility tests (axe-core only)
        run: npm run test:a11y

  # Full integration suite: per-tile axe-core loop + smoke + layout +
  # theme + viewer + print + CSV + perf (spec-v10 §E.1 / §E.2 / §E.3 /
  # §H.3). Catches regressions in the search auto-route, theme persistence,
  # mobile header layout, Group H reference views, and the bundle
  # round-trip. Runs in parallel with `accessibility`.
  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright and axe-core
        # Chromium runs the whole suite; WebKit (the iOS Safari engine) re-runs
        # the responsive-stress sweep and the shell-print spec via the
        # `webkit-responsive` project in playwright.config.js, so the
        # no-horizontal-scroll guarantee and "the proof prints" are both
        # verified on a second engine. The print rule the shells relied on was
        # Chromium-only, and a Chromium-only pass is what hid that.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium webkit
      # Everything EXCEPT the `a11y:` sweep, which the accessibility job above
      # runs in full. Until 2026-08-30 both jobs ran it: the axe-core pass over
      # all 1,804 routes was executed twice per push. `test:a11y` greps `a11y:`
      # and this greps its inverse, so the two jobs partition the suite exactly
      # -- 1,897 + 2,001 = 3,898 as of 2026-09-02 -- and `npm run test:e2e`
      # still runs the whole thing locally. check-ci-claims pins the axe pass's
      # stated size in README within 5%; the totals here are prose.
      # check-ci-claims asserts the two greps stay complementary.
      - name: Run integration tests (everything the a11y job does not)
        run: npm run test:e2e:ci
      # spec-v18 §6: prerendered-shell 320px horizontal-scroll gate. Needs a
      # built dist/ and a headless browser, so it stays here; the Node-only
      # built-copy gates moved to `test` on 2026-11-14 to run on every push.
      - name: Build site
        run: npm run build
      - name: Prerendered shell mobile audit (320px)
        run: npm run check:shell-mobile

name: Data Refresh

on:
  schedule:
    - cron: "0 12 1 * *"   # 12:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # The pipeline and the unit tests are dependency-free, so this job ran for
      # months with no install at all. The static gates are not quite: for
      # check-ci-claims to count the axe pass it has to run `playwright --list`.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run data pipeline
        run: npm run data:refresh
      - name: Verify integrity
        run: npm run data:verify
      - name: Run unit tests
        run: npm run test:unit
      # A pull request opened by a workflow using GITHUB_TOKEN does not trigger
      # further workflow runs: every data-refresh PR sits at `action_required`
      # with a 0s CI run that never executes. So the 57 static gates DO NOT run
      # on a refresh unless somebody clicks approve, and nobody does -- for
      # months the only checks a refresh faced were data:verify and the unit
      # tests, two of fifty-nine. The whole point of check-manifests,
      # check-citation-freshness, check-verified-on-ledger and the base-TIP
      # provenance check is the data path, and none of them had ever seen it.
      # Run them here, where the run is triggered by `schedule` and executes.
      - name: Static gates (the PR this opens will not run them)
        run: npm run lint
      # The gate built for exactly this branch: a refresh snapshot cut before a
      # hand-correction landed on main passes every other check, because what it
      # restores is internally consistent. Only the stamps show it moved
      # backwards. This job runs ON main and the regenerated shards are still
      # uncommitted here -- create-pull-request commits them in the step below --
      # so the base IS this commit and the comparison is base-vs-working-tree.
      # DATA_STAMP_WORKTREE=1 says that out loud; without it the gate refuses a
      # base equal to HEAD, which is the protection that keeps it from going
      # green on an empty comparison during a push.
      - name: Provenance stamps only move forward vs main
        run: DATA_STAMP_WORKTREE=1 DATA_STAMP_BASE=HEAD npm run check:data-stamps
      - name: Generate data change analysis
        id: analysis
        run: |
          node scripts/analyze-data-changes.mjs > /tmp/data-refresh-body.md
          {
            echo 'body<<EOF'
            cat /tmp/data-refresh-body.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Append per-source last-diff log (spec-v12 §H.3)
        run: node scripts/append-source-diff-log.mjs
      - name: Open pull request if data changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A FIXED branch name, not one keyed to the run id. Keying it to the
          # run id opened a fresh pull request every cycle and left the last
          # one behind: eleven abandoned branches and three open PRs, each a
          # snapshot of an older main. Merging one silently reverts whatever
          # landed after it was cut. A fixed branch is force-updated from the
          # current main every run, so there is exactly one refresh PR and it
          # is never stale.
          branch: data-refresh
          delete-branch: true
          title: "data: monthly refresh"
          body: ${{ steps.analysis.outputs.body }}
          commit-message: "data: monthly refresh"
          add-paths: |
            data/**
            scripts/expected-hashes.json
            scripts/sources.md
